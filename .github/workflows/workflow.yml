name: Workflow for tests

on:
  schedule:
    # The ONLY automatic full test suite run: native builds + "latest"
    # release + gatling + k6 + mastodon, on the 5th of each month at
    # 10:00 UTC (11:00 UK). PR builds are disabled entirely (no pull_request
    # trigger in native-build.yml): renovate PRs auto-merge without a CI
    # gate and any breakage is caught and fixed at the next monthly run.
    # Also runnable manually at any time.
    - cron: '0 10 5 * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  pages: write
  pull-requests: write
  deployments: write
  statuses: write
  checks: write
  packages: write
  repository-projects: write

jobs:
  native-build:
    uses: ./.github/workflows/native-build.yml
  rungatling:
    needs: native-build
    uses: ./.github/workflows/rungatling.yml
  runk6:
    needs: rungatling
    uses: ./.github/workflows/runk6.yml
  post-mastodon:
    needs: runk6
    uses: ./.github/workflows/post-mastodon.yml
    secrets:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      MASTODON_URL: ${{ secrets.MASTODON_URL }}